# Builds the Windows installer when a version tag (v0.2.0, ...) is pushed, signs the update with the
# updater key from the repository secrets, and creates a DRAFT GitHub Release with the installer and
# latest.json. Publish the draft to roll the update out to everyone.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - run: npm test

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Super Tracker ${{ github.ref_name }}
          releaseBody: |
            Download "Super Tracker_..._x64-setup.exe" below and run it.
            The installer is not code-signed yet, so Windows may show "Windows protected your PC": choose More info -> Run anyway.
            Installed copies update themselves.
          releaseDraft: true
          prerelease: false
          args: --config src-tauri/tauri.release.conf.json
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
