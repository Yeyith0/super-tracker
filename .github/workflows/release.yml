# Builds the Windows installer when a version tag (v0.2.0, ...) is pushed, signs the update with the
# updater key from the repository secrets, and creates a DRAFT GitHub Release with the installer and
# latest.json. Title and notes come from that version's section in CHANGELOG.md (also shown in the app).
# Publish the draft to roll the update out to everyone.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - run: npm test

      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          node scripts/release-notes.mjs "${GITHUB_REF_NAME}" > notes.txt
          {
            echo "title=$(head -n 1 notes.txt)"
            echo "body<<NOTES_EOF"
            tail -n +2 notes.txt
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ steps.notes.outputs.title }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: --config src-tauri/tauri.release.conf.json
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
