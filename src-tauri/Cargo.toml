[package]
name = "super-tracker"
version = "0.3.0"
description = "Super Tracker - fan-made Helldivers 2 companion app"
authors = ["Yiğitcan Kılıç"]
license-file = "../LICENSE"
publish = false
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-http = "2"
# Needed by tauri::generate_context! for the plugin configuration in tauri.conf.json.
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
